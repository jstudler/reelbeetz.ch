baseURL = "https://reelbeetz.ch"
locale = "en-us"
title = "REEL BEETZ"

[module]
  [[module.imports]]
    path = "github.com/curtiscde/hugo-theme-massively"

[params]
favicon = "/reel-beetz-favicon.png"
ignoreFiles = [ ".DS_Store" ]

[params.posts]
  folderName = "releases"

[taxonomies]
  tag = ""
  group = ""
  category = ""

# The release layouts read the artwork through the assets pipeline so Hugo can
# resize it and extract its dominant colours (`.Colors`). Artwork lives in
# static/, which is not an asset source by default, so mount it as one. Declaring
# any mount with target "assets" replaces the default assets mount, hence both
# entries are needed.
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "assets"

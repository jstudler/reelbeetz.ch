baseURL = "https://reelbeetz.ch"
locale = "en-us"
title = "REEL BEETZ"

[module]
  [[module.imports]]
    path = "github.com/curtiscde/hugo-theme-massively"

[params]
favicon = "/reel-beetz-favicon.png"
ignoreFiles = [ ".DS_Store" ]

[params.posts]
  folderName = "releases"
  # The theme paginates the home page list with `params.posts.pagesize`
  # (default 6), not Hugo's own `pagination.pagerSize`. A page size larger than
  # the release count puts every release on one page; the theme's pagination
  # partial then renders nothing because it only outputs when TotalPages > 1.
  pagesize = 9999

[taxonomies]
  tag = ""
  group = ""
  category = ""

# Release credits are rendered through markdownify so they can carry Markdown
# and raw HTML. Goldmark discards raw HTML unless the renderer is marked
# unsafe; this is a single-author site, so there is no untrusted Markdown to
# protect against.
[markup.goldmark.renderer]
  unsafe = true

# Goldmark turns bare URLs into links by default, which made the
# "(www.liliansalathe.ch)" in several releases' credits a link as soon as
# credits started being rendered as Markdown. Links in credits are not wanted
# yet, and no markdown body on this site relies on autolinking, so require the
# explicit [text](url) form everywhere.
[markup.goldmark.extensions]
  linkify = false

# The release layouts read the artwork through the assets pipeline so Hugo can
# resize it and extract its dominant colours (`.Colors`). Artwork lives in
# static/, which is not an asset source by default, so mount it as one. Declaring
# any mount with target "assets" replaces the default assets mount, hence both
# entries are needed.
[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "static"
  target = "assets"
